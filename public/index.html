<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YT Downloader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>YT Downloader</h1>

        <p class="subtitle">
            Download videos or audio from your own YouTube videos.
        </p>

        <section class="downloader-card">

            <label for="youtube-url">
                YouTube URL
            </label>

            <input
                type="url"
                id="youtube-url"
                placeholder="https://www.youtube.com/watch?v=..."
            >

            <div class="time-container">

                <div>
                    <label for="start-time">
                        Start time
                    </label>

                    <input
                        type="text"
                        id="start-time"
                        placeholder="00:00"
                    >
                </div>

                <div>
                    <label for="end-time">
                        End time
                    </label>

                    <input
                        type="text"
                        id="end-time"
                        placeholder="01:00"
                    >
                </div>

            </div>

            <label>
                Download type
            </label>

            <div class="options">

                <label class="option">
                    <input
                        type="radio"
                        name="download-type"
                        value="video"
                        checked
                    >
                    Video
                </label>

                <label class="option">
                    <input
                        type="radio"
                        name="download-type"
                        value="audio"
                    >
                    Audio
                </label>

            </div>

            <button id="download-btn">
                Download
            </button>

            <p id="status"></p>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
